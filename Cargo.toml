[workspace]
resolver = "2"
members = ["crates/runjs-cli", "crates/runjs-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
deno_core = "0.412.0"
deno_ast = { version = "0.53.3", features = ["transpiling"] }
deno_error = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
